<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transam mark">
  <title>Transam mark</title>
  <defs>
    <radialGradient id="lmCore" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#cafff1"/>
      <stop offset="40%" stop-color="#43e3a3"/>
      <stop offset="100%" stop-color="#168a63"/>
    </radialGradient>
    <linearGradient id="lmBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f2f7fd"/>
      <stop offset="100%" stop-color="#8fb2d8"/>
    </linearGradient>
  </defs>

  <!-- wings -->
  <g>
    <path d="M17 15 L30 4.5 L25 15 L18.5 18.5 Z" fill="url(#lmBlade)"/>
    <path d="M30 4.5 L25 15 L27.4 10.5 Z" fill="#43e3a3"/>
  </g>
  <g transform="translate(32,0) scale(-1,1)">
    <path d="M17 15 L30 4.5 L25 15 L18.5 18.5 Z" fill="url(#lmBlade)"/>
    <path d="M30 4.5 L25 15 L27.4 10.5 Z" fill="#43e3a3"/>
  </g>

  <!-- core -->
  <circle cx="16" cy="17.5" r="9" fill="#10221c"/>
  <circle cx="16" cy="17.5" r="7.8" fill="url(#lmCore)"/>

  <!-- transmission glyph: up + down -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-width="2.4">
    <path d="M12.6 22.5 L12.6 12.8 M10 15.2 L12.6 12.2 L15.2 15.2" stroke="#f3fffb"/>
    <path d="M19.4 12.5 L19.4 22.2 M16.8 19.8 L19.4 22.8 L22 19.8" stroke="#0c3526"/>
  </g>
</svg>
