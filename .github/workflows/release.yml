# Build the release installers on native GitHub runners: the Windows NSIS setup
# and the macOS DMGs (arm64 + x64; those can't be built off a Mac at all).
# A v* tag publishes them as a GitHub release; a manual run just leaves them as
# workflow artifacts.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Builds only read the repo; the release job alone gets write, via the run's
# short-lived GITHUB_TOKEN — no stored PAT/secret is involved.
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            files: release/*.exe
          - os: macos-latest
            script: dist:mac
            files: release/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.14.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: transam-${{ runner.os }}
          path: ${{ matrix.files }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        # notes = this version's CHANGELOG.md section (fails the release if missing)
        run: |
          scripts/changelog-section.sh "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" out/* --title "Transam ${GITHUB_REF_NAME#v}" --notes-file notes.md
